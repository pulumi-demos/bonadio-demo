name: ${PROJECT}
description: ${DESCRIPTION}
runtime: dotnet
template:
  description: A C# program that deploys an Azure App Service using the azure-appservice component from the private registry
  config:
    azure-native:location:
      description: The Azure region to deploy to
      default: eastus
    skuName:
      description: App Service plan SKU name (e.g. B1, S1, P1v3)
      default: B1
    skuTier:
      description: App Service plan SKU tier (e.g. Basic, Standard, PremiumV3)
      default: Basic
    linuxFxVersion:
      description: Linux runtime stack (e.g. DOTNETCORE|10.0, NODE|22-lts)
      default: DOTNETCORE|10.0
packages:
  azure-appservice: github.com/pulumi-demos/bonadio-demo/components/AppService@0.1.0
